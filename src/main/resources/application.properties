# ===================================================================
# Online Student Feedback System - Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=feedback

# MySQL 8 Database Configuration
# NOTE: Replace 'YOUR_MYSQL_PASSWORD' below with your actual MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/feedbackdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
